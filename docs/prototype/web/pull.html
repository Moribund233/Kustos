                <div class="review-actions">
                  <button class="btn btn-ghost btn-sm btn-block" id="approve-btn" type="button">
                    <svg class="icon" aria-hidden="true"><use href="#i-check"></use></svg>Approve
                  </button>
                  <button class="btn btn-ghost btn-sm btn-block request-changes" id="request-btn" type="button">Request changes</button>
                </div>
              </div>
            </section>

            <section class="float-pane" data-pane="checks">
              <div class="rail-block">
                <h3>Status checks</h3>
                <div class="mini-check"><span class="lamp is-good" aria-hidden="true"></span><span>unit</span><span class="mini-check-time mono">1m 42s</span></div>
                <div class="mini-check"><span class="lamp is-good" aria-hidden="true"></span><span>security-scan</span><span class="mini-check-time mono">38s</span></div>
                <div class="mini-check" data-mini-e2e><span class="lamp is-warn is-live" aria-hidden="true"></span><span>e2e</span><span class="mini-check-time mono">queued</span></div>
                <p class="context-note">Branch protection on this repo requires three checks. The server decides whether a missing record counts as pass or fail.</p>
              </div>
            </section>

            <section class="float-pane" data-pane="merge">
              <div class="rail-block">
                <section class="merge-box" id="merge-box">
                  <div class="merge-state">
                    <span class="merge-lamp" id="merge-lamp" aria-hidden="true"><span class="lamp is-warn"></span></span>
                    <div>
                      <strong id="merge-title">Review required</strong>
                      <p id="merge-desc">1 approval and 1 check remaining.</p>
                    </div>
                  </div>
                  <div class="merge-checks">
                    <span id="merge-review-state"><svg class="icon icon-xs" aria-hidden="true"><use href="#i-clock"></use></svg>Review required</span>
                    <span id="merge-check-state"><svg class="icon icon-xs" aria-hidden="true"><use href="#i-clock"></use></svg>e2e queued</span>
                  </div>
                  <button class="btn btn-primary btn-block" id="merge-btn" type="button" disabled>
                    <svg class="icon" aria-hidden="true"><use href="#i-merge"></use></svg>Squash and merge
                  </button>
                  <p class="fine"><svg class="icon icon-xs" aria-hidden="true"><use href="#i-shield"></use></svg>Branch protection on <span class="mono">main</span> requires 1 approval and 3 checks.</p>
                  <p class="fine">Repo owners and global admins can override protection; the override is audited with a reason.</p>
                </section>
              </div>
              <div class="rail-block">
                <div class="rail-head">
                  <h3>Linked issues</h3>
                  <span class="rail-count" id="linked-issue-count">1</span>
                </div>
                <a href="issues.html" class="linked-issue">
                  <svg class="icon icon-sm" aria-hidden="true"><use href="#i-issue"></use></svg>
                  <span class="linked-issue-copy">
                    <span class="linked-issue-title">LFS uploads &gt;5GB fail before the size guard</span>
                    <span class="fine"><span class="mono">#76</span> · open · closes on merge</span>
                  </span>
                </a>
                <button class="text-link mt-8" type="button" data-toast="POST /pull-requests/142/issues — 关联同仓库 Issue；合并时按 closes_on_merge 关闭">Link issue</button>
              </div>
              <div class="rail-block">
                <h3>Merge strategy</h3>
                <p class="fine">Default for this repository is <span class="mono">squash</span>. Merge commits and rebase are also available.</p>
                <button class="text-link mt-8" type="button" data-toast="Merge strategy is set per repository by admins.">Change repository default</button>
              </div>
            </section>
          </div>
        </aside>
      </div>
    </section>

  </template>

  <div class="overlay" id="merge-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="merge-modal-title">
      <div class="modal-head">
        <div>
          <p class="eyebrow">Pull request #142</p>
          <h2 id="merge-modal-title">Merge into main</h2>
          <p class="fine">All required reviews and checks will be recorded in PR activity.</p>
        </div>
        <button class="icon-btn" type="button" data-close aria-label="Close">
          <svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg>
        </button>
      </div>
      <div class="modal-body">
        <label class="radio-row">
          <input type="radio" name="merge-method" value="squash" checked>
          <span><strong>Squash and merge</strong><span>One commit on main. Keeps the branch history quiet.</span></span>
        </label>
        <label class="radio-row">
          <input type="radio" name="merge-method" value="merge">
          <span><strong>Create a merge commit</strong><span>Preserves all three commits and adds a merge commit.</span></span>
        </label>
        <label class="radio-row">
          <input type="radio" name="merge-method" value="rebase">
          <span><strong>Rebase and merge</strong><span>Replays the commits on main without a merge commit.</span></span>
        </label>
        <p class="fine">The branch <span class="mono">mara/lfs-token-scope</span> will be deleted after merge.</p>
      </div>
      <div class="modal-foot">
        <button class="btn btn-quiet" type="button" data-close>Cancel</button>
        <button class="btn btn-primary" type="button" id="confirm-merge">
          <svg class="icon" aria-hidden="true"><use href="#i-merge"></use></svg>Squash and merge
        </button>
      </div>
    </div>
  </div>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/util.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/pull.js"></script>
</body>
</html>
