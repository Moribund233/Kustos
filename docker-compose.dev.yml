# =============================================================================
# Kustos 开发环境 Docker Compose 配置（精简版）
#
# 适用场景：
#   开发环境（自包含）：内置 PostgreSQL（独立数据卷）；
#   前端本地 Vite、网关容器内置 Nginx 反代。
#
# 架构:
#   本地 Vite (localhost:5173) → 前端开发服务器
#   网关容器 (localhost:18088) → git-http-backend (CGI) — Git HTTP Smart Protocol
#   网关容器 (localhost:18088) → FastAPI (proxy)        — API / WebSocket
#   FastAPI → PostgreSQL（compose 内置 postgres 服务）  — 数据库
#
# 宿主端口刻意选冷门值（18088 / 18002 / 19002），避免与本机常见的 8000/8080/9000
# 段服务撞车；三者都可用环境变量覆盖（KUSTOS_DEV_GATEWAY_PORT / KUSTOS_DEV_API_PORT /
# KUSTOS_DEV_GIT_HTTP_PORT）。容器名与网络名不写死，由 compose 按项目名派生，
# 这样同一份配置可以在多个项目名下并存而不互相抢名字。
#
# 前置条件:
#   1. .env 已设置 POSTGRES_PASSWORD（与生产共用 .env）
#
# 使用方式:
#   1. 复制环境变量模板: cp .env.dev .env
#   2. 修改 .env 中的配置（特别是 JWT 密钥和数据库连接）
#   3. 启动服务: docker compose -f docker-compose.dev.yml -p kustos-dev up -d
#
# 服务访问地址:
#   - 前端: http://localhost:5173
#   - 统一入口（前端 / API / WebSocket / Git HTTP）: http://localhost:18088
#
# 常用命令:
#   docker compose -f docker-compose.dev.yml -p kustos-dev logs -f app      # 后端日志
#   docker compose -f docker-compose.dev.yml -p kustos-dev exec app bash    # 进入容器
#   docker compose -f docker-compose.dev.yml -p kustos-dev down             # 停止服务
#   docker compose -f docker-compose.dev.yml -p kustos-dev down -v          # 停止并清数据
# =============================================================================

services:
  # =============================================
  # PostgreSQL（开发自包含；独立容器/数据卷，避免与生产 kustos-postgres 冲突）
  # =============================================
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kustos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?错误：请设置 POSTGRES_PASSWORD 到 .env 文件}
      POSTGRES_DB: kustos
      TZ: Asia/Shanghai
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kustos -d kustos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # =============================================
  # FastAPI 后端 (开发模式，支持热重载)
  # =============================================
  app:
    build:
      context: ./backend
      dockerfile: ../docker/dev/Dockerfile.backend
    environment:
      # 数据库连接（compose 内置 PostgreSQL）
      DATABASE_URL: postgresql://kustos:${POSTGRES_PASSWORD:?错误：请设置 POSTGRES_PASSWORD 到 .env 文件}@postgres:5432/kustos
      # Redis 连接（可选）
      # REDIS_URL: ${REDIS_URL:-redis://host.docker.internal:6379/0}
      # JWT 密钥（必需修改！）
      KUSTOS_SECURITY_SECRET_KEY: ${KUSTOS_SECURITY_SECRET_KEY:?错误：请设置 JWT 密钥到 .env 文件}
      # 调试模式
      KUSTOS_APP_DEBUG: "true"
      KUSTOS_STRESS_TEST: "false"
      # 开发模式：启动时自动执行迁移 + 管理员引导（幂等）
      KUSTOS_INIT_DATABASE: "true"
      # 日志级别
      LOG_LEVEL: debug
      # 时区
      TZ: Asia/Shanghai
      # Git 裸仓库根目录（与 git-cgi 共享 volume）
      KUSTOS_STORAGE_REPO_ROOT: /data/repositories
      # 首次运行管理员引导（通过 .env 文件配置）
      KUSTOS_ADMIN_USERNAME: ${KUSTOS_ADMIN_USERNAME:-admin}
      KUSTOS_ADMIN_PASSWORD: ${KUSTOS_ADMIN_PASSWORD}
      KUSTOS_ADMIN_EMAIL: ${KUSTOS_ADMIN_EMAIL:-admin@example.com}
      # 协作内部端点密钥 (与 collab 服务共享; 未设置时用开发默认值)
      KUSTOS_COLLAB_INTERNAL_SECRET: ${KUSTOS_COLLAB_INTERNAL_SECRET:-dev-collab-internal-secret}
      # 协作感知：聚合各副本的活跃文档（与 collab 服务的 ACTIVE_PORT 对应）
      KUSTOS_COLLAB_ACTIVE_ENDPOINTS: "${KUSTOS_COLLAB_ACTIVE_ENDPOINTS:-http://collab:4446}"
      # 编排组件状态（admin 控制台）：经只读 docker-socket-proxy 查询容器
      # Git hook 内部密钥（git-cgi 的 pre/post-receive 回调校验，开发默认值）
      KUSTOS_GIT_HOOK_SECRET: ${KUSTOS_GIT_HOOK_SECRET:-dev-git-hook-secret}
      KUSTOS_DOCKER_HOST: "http://docker-socket-proxy:2375"
      # 窄写 Docker 代理：admin 控制台开关可选服务栈（启停容器）
      KUSTOS_DOCKER_WRITE_HOST: "http://docker-write-proxy:2376"
      # 监控栈（Grafana SSO）：开发环境与生产共用 .env 的 GRAFANA_ADMIN_PASSWORD
      KUSTOS_GRAFANA_URL: "http://grafana:3000"
      KUSTOS_GRAFANA_SUBPATH: "/grafana"
      KUSTOS_GRAFANA_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-}"
    volumes:
      # 代码挂载（支持热重载）
      - ./backend:/app
      # 仓库数据持久化
      - repos_dev:/data/repositories
      # LFS 对象存储持久化
      - lfs_dev:/data/lfs
      # 日志目录
      - ./backend/logs:/app/logs
    ports:
      # 后端直连端口（调试时绕过网关用）。宿主口取冷门值，避开 8000 段的常见占用。
      - "127.0.0.1:${KUSTOS_DEV_API_PORT:-18002}:8000"
    # 使用 unless-stopped 而非 "no"，确保 reloader 崩溃后自动重启
    restart: unless-stopped
    # 资源限制
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    # 启用交互式终端（方便调试）
    stdin_open: true
    tty: true
    # 使用 host.docker.internal 访问宿主机上的外部服务
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  # =============================================
  # 协作编辑 Yjs 网关 (Hocuspocus 哑管道, 开发模式热重载)
  # =============================================
  collab:
    build:
      # dockerfile 相对构建上下文解析：services/collab → services → 仓库根 → docker/
      context: ./services/collab
      dockerfile: ../../docker/collab/Dockerfile
    command: ["node", "--watch", "server.mjs"]
    environment:
      KUSTOS_APP_URL: http://app:8000
      KUSTOS_COLLAB_INTERNAL_SECRET: ${KUSTOS_COLLAB_INTERNAL_SECRET:-dev-collab-internal-secret}
      TZ: Asia/Shanghai
    volumes:
      # 源码挂载 (支持热重载)
      - ./services/collab:/app/gateway
      # 屏蔽宿主 node_modules (Windows 二进制与 Linux 容器不兼容), 使用镜像内依赖
      - collab_gateway_node_modules:/app/gateway/node_modules
    depends_on:
      - app
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # =============================================
  # 只读 Docker socket 代理 — 供 app 查询编排组件状态（admin 控制台）
  # 仅暴露 /containers* 的 GET，禁止一切写操作（POST=0）
  # =============================================
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.2.0
    environment:
      CONTAINERS: "1"   # 允许 GET /containers/*
      POST: "0"         # 禁止写操作
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 32M
        reservations:
          memory: 16M

  # =============================================
  # 窄写 Docker 代理 — 供 admin 控制台启停可选服务栈（监控栈）
  # 仅放行 POST /containers/{id}/{start|stop|restart}; 内网部署，目标容器
  # 选择在应用层审计，代理层只做最小写窗口
  # =============================================
  docker-write-proxy:
    image: openresty/openresty:1.31.1.1-0-bookworm-fat
    volumes:
      - ./docker/docker-write-proxy/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./docker/docker-write-proxy/docker_write_acl.lua:/etc/nginx/docker_write_acl.lua:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 32M
        reservations:
          memory: 16M

  # =============================================
  # 一次性测试容器（运行后自动退出）
  # 注意: conftest 会在 setup/teardown 清空 KUSTOS_STORAGE_REPO_ROOT
  # 下的所有内容, 因此必须用独立的仓库根目录, 严禁挂载 repos_dev 卷
  # =============================================
  test:
    # 一次性测试容器，不参与 `up -d`：只有显式 `run --rm test` 才会启动，
    # 否则每次拉起开发栈都会顺带把整套 pytest 跑一遍。
    profiles: ["test"]
    build:
      context: ./backend
      dockerfile: ../docker/dev/Dockerfile.backend
    environment:
      DATABASE_URL: postgresql://kustos:${POSTGRES_PASSWORD:?错误：请设置 POSTGRES_PASSWORD 到 .env 文件}@postgres:5432/kustos
      KUSTOS_SECURITY_SECRET_KEY: test-secret-key-for-testing
      # 调试模式会放开 admin 接口的鉴权，admin 门禁用例要求关闭
      KUSTOS_APP_DEBUG: "false"
      KUSTOS_STRESS_TEST: "false"
      KUSTOS_STORAGE_REPO_ROOT: /tmp/kustos-test-repositories
      LOG_LEVEL: error
      TZ: Asia/Shanghai
    volumes:
      - ./backend:/app
      # 网关/nginx 与监控配置的静态断言读仓库实况（docker/ 不在应用镜像内）
      - ./docker:/app/docker:ro
    # 直接执行 pytest，跳过 Dockerfile.backend 的 entrypoint（其 init_app 会作用到
    # 共享的 dev 库；测试用 conftest 自建的临时库，无需也不应触碰 dev 库）
    entrypoint: []
    # 默认命令是跑测试，但可以通过命令行覆盖
    command: ["python", "-m", "pytest", "tests/", "-v"]
    # 不自动重启（一次性任务）
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G

  # =============================================
  # git-http-backend CGI 容器
  # =============================================
  git-cgi:
    build:
      # 上下文为 ./docker：镜像需 COPY git-hooks/ 集中 hook 脚本
      context: ./docker
      dockerfile: git-cgi/Dockerfile
      # 针对国内网络环境优化
      args:
        - ALPINE_MIRROR=mirrors.aliyun.com
    volumes:
      - repos_dev:/data/repositories
    environment:
      FCGI_PORT: "9000"
      GIT_PROJECT_ROOT: /data/repositories
      GIT_HTTP_EXPORT_ALL: "1"
      # Git hook 回调应用（pre/post-receive；开发默认密钥，与 app 环境一致）
      KUSTOS_APP_URL: http://app:8000
      KUSTOS_GIT_HOOK_SECRET: ${KUSTOS_GIT_HOOK_SECRET:-dev-git-hook-secret}
    ports:
      # 暴露 FCGI 端口（仅供直连调试，正常流量走网关）
      - "127.0.0.1:${KUSTOS_DEV_GIT_HTTP_PORT:-19002}:9000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  # =============================================
  # 网关容器（Nginx）：CORS 统一处理 + API/WS/Git 代理
  # 配置文件: docker/dev/nginx.dev.conf
  # CORS 白名单: localhost / 127.0.0.1 / 内网段
  # =============================================
  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/dev/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - repos_dev:/data/repositories
    ports:
      # 统一入口: http://localhost:18088 （前端 / API / WebSocket / Git HTTP）
      - "127.0.0.1:${KUSTOS_DEV_GATEWAY_PORT:-18088}:80"
    extra_hosts:
      # 访问宿主机上的 Vite 开发服务器 (localhost:5173)
      - "host.docker.internal:host-gateway"
    depends_on:
      - app
      - git-cgi
      - collab
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

# =============================================
# 数据卷定义
# =============================================
volumes:
  repos_dev:
    driver: local
  lfs_dev:
    driver: local
  collab_gateway_node_modules:
    driver: local
  postgres_dev_data:
    driver: local

# =============================================
# 网络配置
# 不指定 name：由 compose 按项目名派生（<project>_default），
# 同一份配置在不同 -p 下并存时不会抢同一个网络名。
# =============================================
networks:
  default:
    driver: bridge